<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Easy-Coding-Agent architecture banner</title>
  <desc id="desc">Vector banner for Easy-Coding-Agent showing an autonomous coding loop with planner, tools, memory, terminal, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#13315c"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <path d="M0 274 C120 232 240 320 384 270 C540 216 630 126 792 162 C960 200 1014 292 1200 232 L1200 360 L0 360 Z" fill="#0f2437" opacity="0.8"/>
  <path d="M0 304 C145 254 285 316 432 285 C585 253 675 196 820 215 C965 234 1035 307 1200 275" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.65"/>

  <g filter="url(#shadow)">
    <rect x="56" y="54" width="342" height="252" rx="18" fill="url(#panel)"/>
    <text x="86" y="103" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Easy-Coding-Agent</text>
    <text x="86" y="137" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Autonomous coding workflow for real repos</text>
    <rect x="86" y="164" width="254" height="10" rx="5" fill="url(#accent)"/>
    <g fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
      <text x="86" y="212">Plan -> edit -> test -> debug</text>
      <text x="86" y="242">Tools, terminal, files, and memory</text>
      <text x="86" y="272">Evidence-gated completion claims</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="470" y="54" width="190" height="72" rx="14" fill="#ecfeff"/>
    <text x="502" y="87" fill="#155e75" font-size="18" font-weight="800">Planner</text>
    <text x="502" y="111" fill="#155e75" font-size="14">task list + mode</text>

    <rect x="470" y="154" width="190" height="72" rx="14" fill="#f0fdf4"/>
    <text x="502" y="187" fill="#166534" font-size="18" font-weight="800">Tools</text>
    <text x="502" y="211" fill="#166534" font-size="14">read / edit / shell</text>

    <rect x="470" y="254" width="190" height="72" rx="14" fill="#fff7ed"/>
    <text x="502" y="287" fill="#9a3412" font-size="18" font-weight="800">Verifier</text>
    <text x="502" y="311" fill="#9a3412" font-size="14">tests + logs</text>

    <rect x="744" y="54" width="190" height="72" rx="14" fill="#eff6ff"/>
    <text x="776" y="87" fill="#1d4ed8" font-size="18" font-weight="800">Workspace</text>
    <text x="776" y="111" fill="#1d4ed8" font-size="14">repo files + diffs</text>

    <rect x="744" y="154" width="190" height="72" rx="14" fill="#f8fafc"/>
    <text x="776" y="187" fill="#334155" font-size="18" font-weight="800">Memory</text>
    <text x="776" y="211" fill="#334155" font-size="14">refs + task state</text>

    <rect x="744" y="254" width="190" height="72" rx="14" fill="#fef2f2"/>
    <text x="776" y="287" fill="#991b1b" font-size="18" font-weight="800">Quality Gates</text>
    <text x="776" y="311" fill="#991b1b" font-size="14">evidence before done</text>
  </g>

  <g fill="none" stroke="#dbeafe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M398 180 H450"/>
    <path d="M660 90 H724"/>
    <path d="M660 190 H724"/>
    <path d="M660 290 H724"/>
    <path d="M839 126 V154"/>
    <path d="M839 226 V254"/>
  </g>
  <g fill="#dbeafe">
    <path d="M450 180 L438 172 L438 188 Z"/>
    <path d="M724 90 L712 82 L712 98 Z"/>
    <path d="M724 190 L712 182 L712 198 Z"/>
    <path d="M724 290 L712 282 L712 298 Z"/>
    <path d="M839 154 L831 142 L847 142 Z"/>
    <path d="M839 254 L831 242 L847 242 Z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="82" width="150" height="182" rx="18" fill="#0f172a"/>
    <rect x="1012" y="110" width="106" height="10" rx="5" fill="#22c55e"/>
    <rect x="1012" y="136" width="78" height="10" rx="5" fill="#38bdf8"/>
    <rect x="1012" y="162" width="92" height="10" rx="5" fill="#facc15"/>
    <path d="M1015 213 L1032 230 L1070 190" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1012" y="244" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">tested output</text>
  </g>
</svg>
