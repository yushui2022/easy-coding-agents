# Copy to eca.toml in the project you want to work on.
[agent]
api_format = "openai" # or "anthropic" / "responses"; then set matching model, base_url and api_key_env
model = "Qwen/Qwen2.5-Coder-32B-Instruct"
base_url = "https://api-inference.modelscope.cn/v1"
api_key_env = "MODELSCOPE_API_KEY"
mode = "code"
permission = "ask"
sandbox = "none" # opt in with "docker": local Linux engine, no network, no host fallback
sandbox_image = "python:3.11-slim" # must already exist locally; include test dependencies in your trusted image
max_turns = 40
network_retries = 2 # 0..5; transient model failures before text output only
project_memory = true # sourced project memory; false disables automatic capture/injection
auto_compact = true # summarizes older context near budget; consumes model requests
max_output_tokens = 8192 # response token cap for both OpenAI-compatible and Anthropic APIs
context_chars = 100000
command_timeout = 120
request_timeout = 120
output_limit = 24000
stream_usage = true # request usage in OpenAI-compatible streams; false for incompatible servers
subagent_max_turns = 6 # per child; also bounded by parent max_turns
subagent_concurrency = 2 # simultaneous children, 1..8; excess tasks wait
subagent_max_calls = 3 # per parent run; no recursive delegation
subagent_timeout = 180 # seconds per child
worker_profiles = [] # optional: ["local_helper", "fast"]; empty preserves single-API behavior

[profiles]
reviewer = "Review code for concrete correctness problems. Cite files and lines. Do not edit unless the user asks."
builder = "Implement the requested change using existing project conventions, then run appropriate checks."

# Optional MCP support: pip install -e ".[mcp]"
# All MCP operations require approval, including launching a stdio server.
# [mcp_servers.local]
# transport = "stdio"
# command = "python"
# args = ["G:/Projects/my-mcp/server.py"]
# timeout = 30
# env = { SERVICE_TOKEN = "MY_SERVICE_TOKEN" } # destination variable = source env variable

# [mcp_servers.remote]
# transport = "http"
# url = "https://example.com/mcp"
# headers = { Authorization = "MY_MCP_AUTHORIZATION" } # env contains full Bearer value

# EXAMPLE ONLY: replace model and rates with your actual provider contract.
# Amounts per million tokens, decimal strings. Missing prices stay unknown.
# [pricing."YOUR_MODEL_ID"]
# currency = "USD"
# input = "1.00"
# output = "2.00"
# cache_read = "0.10"
# cache_write = "1.25"
# cache_write_5m = "1.25"
# cache_write_1h = "2.00"

# v0.7: choose api_format = "responses" and reasoning_effort = "low"
# inside [agent], with an endpoint/model that supports them.
# Parallel delegates use subagent_max_calls/turns/timeout above.

# Install a language server yourself, then enable its stdio command:
# [lsp_servers.python]
# command = "pyright-langserver"
# args = ["--stdio"]
# language_id = "python"
# timeout = 30

# v0.8: a profile binds a model to its own endpoint and credential variable.
# Select with --model-profile fast or /model @fast.
# [model_profiles.fast]
# model = "YOUR_MODEL_ID"
# base_url = "https://YOUR_PROVIDER/v1"
# api_format = "openai"
# api_key_env = "FAST_MODEL_KEY"
# stream_usage = true
# max_output_tokens = 4096


# Optional worker model: also add "local_helper" to [agent].worker_profiles above.
# Start your compatible local server yourself; ECA never installs or downloads models.
# Set LOCAL_MODEL_KEY=local in .env for a local server without authentication.
# [model_profiles.local_helper]
# model = "YOUR_INSTALLED_TOOL_CAPABLE_MODEL"
# base_url = "http://localhost:11434/v1"
# api_format = "openai"
# api_key_env = "LOCAL_MODEL_KEY"
# stream_usage = false
# max_output_tokens = 2048
# context_chars = 16000
