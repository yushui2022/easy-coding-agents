[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-coding-agent"
version = "0.35.0"
description = "An asynchronous, project-scoped terminal coding assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.99,<3", "httpx[socks]>=0.27,<1", "prompt-toolkit>=3.0.48,<4", "rich>=13,<15", "python-dotenv>=1,<2"]

[project.scripts]
eca = "eca.cli:main"
ecs = "eca.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2", "jsonschema>=4.20,<5"]

[tool.setuptools.packages.find]
include = ["eca*", "agent_memory_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
