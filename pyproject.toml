[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-coding-agent"
version = "0.5.0"
description = "An asynchronous, project-scoped terminal coding assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.30,<3", "httpx>=0.27,<1", "prompt-toolkit>=3.0.48,<4", "rich>=13,<15", "python-dotenv>=1,<2"]

[project.scripts]
eca = "eca.cli:main"

[tool.setuptools.packages.find]
include = ["eca*", "agent_memory_core*"]
